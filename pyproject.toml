[project]
name = "marketdata"
version = "0.1.0"
description = "Trusted, verified data from SEC filings: proof on every value, cross-checks, published accuracy, announced changes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
marketdata = "marketdata.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import order
    "B",     # bugbear
    "UP",    # pyupgrade
    "SIM",   # simplify
    "N",     # naming
    "RUF",   # ruff-specific
    "ASYNC", # async pitfalls
    "DTZ",   # timezone-aware datetimes only (all timestamps are UTC)
]

[tool.ruff.lint.per-file-ignores]
# Revision files are named after their revision id (0001_foundation.py), and their SQL
# keeps the PLAN.md §7 layout, including long trailing comments.
"marketdata/db/migrations/versions/*.py" = ["N999", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Revision files start with a digit, which is not a valid module name; they hold only SQL.
exclude = ["marketdata/db/migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL at TEST_DATABASE_URL",
]
