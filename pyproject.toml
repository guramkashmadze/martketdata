[project]
name = "marketdata"
version = "0.1.0"
description = "Trusted, verified data from SEC filings: proof on every value, cross-checks, published accuracy, announced changes."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.11,<4",  # the scheduler process (E3-S3); 4.0 is still an alpha
    "boto3>=1.43",           # S3RawStore (R2 or B2 in production)
    "cryptography>=46",      # webhook signing secrets encrypted at rest (E5b)
    "fastapi>=0.115",
    "httpx2>=2.16",          # SEC client; also what Starlette's TestClient uses (D-042)
    "jinja2>=3.1",           # proof pages (E5b), later the web UI (E15)
    "lxml>=6.1",             # press release tables and text (E7a)
    "mcp>=2.3",              # the MCP server at /mcp (E6)
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "tenacity>=9.2",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.scripts]
marketdata = "marketdata.cli:app"

[dependency-groups]
dev = [
    "black>=24.10",
    "flake8>=7.1",
    "flake8-async>=24.9",     # ASYNC: async pitfalls
    "flake8-bugbear>=24.8",   # B: likely bugs
    "flake8-datetimez>=20.10", # DTZ: timezone-aware datetimes only (all timestamps are UTC)
    "flake8-simplify>=0.21",  # SIM: simpler equivalents
    "isort>=5.13",
    "moto[s3]>=5.2",          # in-process S3 for the S3RawStore tests
    "mypy>=1.13",
    "pep8-naming>=0.14",      # N: naming
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "types-boto3[s3]>=1.43",  # boto3 types for mypy --strict
    "types-lxml>=2026.2",     # lxml types for mypy --strict
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PDM manages the environment and pdm.lock (D-041). flake8 reads its settings from .flake8.
[tool.pdm.scripts]
fmt = { composite = ["isort .", "black ."], help = "Sort imports and format the code" }
lint = { composite = [
    "black --check .",
    "isort --check-only --diff .",
    "flake8",
    "mypy marketdata",
], help = "Format check, import order, lint and types: the CI gate" }

[tool.black]
line-length = 100
target-version = ["py315"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["marketdata"]
skip_gitignore = true

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
# Revision files start with a digit, which is not a valid module name; they hold only SQL.
exclude = ["marketdata/db/migrations/versions/"]

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type hints; only tasks/scheduler.py uses it.
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL at TEST_DATABASE_URL",
]
