name: marketdata

services:
  postgres:
    # Pinned to a major version: data directories don't carry over between majors (D-040).
    image: postgres:18
    environment:
      POSTGRES_USER: marketdata
      POSTGRES_PASSWORD: marketdata
      POSTGRES_DB: marketdata
    # Host port 5433, so it can run next to a local PostgreSQL on 5432 (D-037).
    # Bound to localhost only: the password above is a dev default.
    ports:
      - "127.0.0.1:5433:5432"
    # From 18 the image keeps data in /var/lib/postgresql/<major>/docker, so the volume is
    # mounted one level up and a later major can be upgraded in place with pg_upgrade.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketdata -d marketdata"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API, MCP server and web UI from the Dockerfile (D-134), running without a terminal and
  # started again after a crash or a Docker restart: `docker compose up -d api`. The settings
  # come from .env; only the database address is the container's own.
  api:
    build: .
    image: marketdata
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container localhost is the container: a PostgreSQL on this machine is
      # host.docker.internal (CONTAINER_DATABASE_URL in .env). Without it, the PostgreSQL above.
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://marketdata:marketdata@postgres:5432/marketdata}
    # Published on this machine's localhost only, as PostgreSQL is.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

volumes:
  postgres-data:
