name: marketdata

services:
  postgres:
    # Pinned to a major version: data directories don't carry over between majors (D-040).
    image: postgres:18
    environment:
      POSTGRES_USER: marketdata
      POSTGRES_PASSWORD: marketdata
      POSTGRES_DB: marketdata
    # Host port 5433, so it can run next to a local PostgreSQL on 5432 (D-037).
    # Bound to localhost only: the password above is a dev default.
    ports:
      - "127.0.0.1:5433:5432"
    # From 18 the image keeps data in /var/lib/postgresql/<major>/docker, so the volume is
    # mounted one level up and a later major can be upgraded in place with pg_upgrade.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketdata -d marketdata"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API, MCP server and web UI from the Dockerfile (D-134), running without a terminal and
  # started again after a crash or a Docker restart: `docker compose up -d api`. The settings
  # come from .env; only the database address is the container's own.
  api:
    build: .
    image: marketdata
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container localhost is the container: a PostgreSQL on this machine is
      # host.docker.internal (CONTAINER_DATABASE_URL in .env). Without it, the PostgreSQL above.
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://marketdata:marketdata@postgres:5432/marketdata}
    # Published on this machine's localhost only, as PostgreSQL is.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # The worker and the scheduler run the image the api service builds (D-137), so filings are
  # watched without a terminal: `docker compose up -d --build api worker scheduler` builds it once
  # and starts all three. They don't build it themselves, as two builds of one tag collide; name
  # api in every --build. The scheduler only enqueues: a watch of each universe company and
  # curated manager every 10 minutes, the security-master load daily. The worker does the work and
  # is the one process calling the SEC (D-062): while it runs, `pdm run marketdata worker` refuses
  # to start and names it ('marketdata worker on docker-compose'); stop it first with `docker
  # compose stop worker`. Started while another process holds the SEC slot, this worker waits and
  # takes over when that one stops.
  worker:
    image: marketdata
    pull_policy: never  # built by the api service, never pulled
    command: ["marketdata", "worker", "--wait"]
    restart: unless-stopped
    init: true  # passes SIGTERM on and reaps child processes
    hostname: docker-compose  # names the worker in PostgreSQL, so a refusal says where it runs
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://marketdata:marketdata@postgres:5432/marketdata}
      RAW_STORE_PATH: /app/var/raw
    volumes:
      # The raw store this machine's processes use (RAW_STORE_PATH in .env): keys start with
      # raw/, so the files sit under var/raw/raw/...
      - ${RAW_STORE_PATH:-./var/raw}:/app/var/raw
      # The universe, overrides and managers files, which the image doesn't hold.
      - ./data:/app/data:ro
      # Behind a proxy that re-signs HTTPS (this dev Mac's network does), the container trusts
      # only Debian's roots and every SEC request fails: a docker-compose.override.yml of this
      # machine's (not committed) mounts a bundle with the proxy's root over the image's CA file
      # (README, "Behind a proxy that re-signs HTTPS").
    # A stop lets running tasks finish for up to a minute and puts the rest back (D-058).
    stop_grace_period: 75s

  scheduler:
    image: marketdata
    pull_policy: never
    command: ["marketdata", "scheduler"]
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql://marketdata:marketdata@postgres:5432/marketdata}

volumes:
  postgres-data:
