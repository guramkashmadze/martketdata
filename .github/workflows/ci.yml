name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: marketdata
          POSTGRES_PASSWORD: marketdata
          POSTGRES_DB: marketdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketdata -d marketdata"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENV: dev
      DATABASE_URL: postgresql://marketdata:marketdata@localhost:5432/marketdata
      TEST_DATABASE_URL: postgresql://marketdata:marketdata@localhost:5432/marketdata_test

    steps:
      - uses: actions/checkout@v5

      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
          cache: true

      # Fails if pdm.lock is missing or out of date with pyproject.toml.
      - name: Install
        run: pdm install --check

      - name: Format
        run: pdm run black --check .

      - name: Import order
        run: pdm run isort --check-only --diff .

      - name: Lint
        run: pdm run flake8

      - name: Types
        run: pdm run mypy marketdata

      - name: Migrate
        run: pdm run alembic upgrade head

      # bash here runs with pipefail, so a failing pytest still fails the step through tee.
      - name: Tests
        shell: bash
        env:
          COLUMNS: "250"  # keep pytest's short failure summary lines whole
        run: pdm run pytest -rfE 2>&1 | tee pytest.log

      # Job logs need a GitHub sign-in; annotations don't. List failed tests there (max 10).
      - name: Annotate failed tests
        if: failure()
        shell: bash
        run: grep -E '^(FAILED|ERROR) ' pytest.log | head -10 | sed 's/^/::error title=pytest::/' || true
