name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketdata
          POSTGRES_PASSWORD: marketdata
          POSTGRES_DB: marketdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketdata -d marketdata"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENV: dev
      DATABASE_URL: postgresql://marketdata:marketdata@localhost:5432/marketdata
      TEST_DATABASE_URL: postgresql://marketdata:marketdata@localhost:5432/marketdata_test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy marketdata

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
