<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Proof{% endblock %} · marketdata</title>
<style>
:root {
  --bg: #ffffff; --fg: #1b1f24; --muted: #5b6470; --line: #d9dee4; --accent: #0b5cad;
  --ok: #1a7f37; --warn: #8a5a00; --bad: #b42318; --chip: #eef1f4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --fg: #e6e9ed; --muted: #9aa4af; --line: #2a3038; --accent: #6cb1ff;
    --ok: #56d364; --warn: #e3b341; --bad: #ff7b72; --chip: #1b2027;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: 1.45rem; line-height: 1.3; margin: 0 0 4px; }
h2 { font-size: 1.1rem; margin: 32px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
h3 { font-size: 1rem; margin: 24px 0 6px; }
.sub { color: var(--muted); margin: 0 0 8px; }
a { color: var(--accent); }
dl { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 6px 18px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
ul { margin: 0; padding-left: 18px; }
.num { font-variant-numeric: tabular-nums; }
.value { font-size: 1.15rem; font-weight: 600; }
.quote { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem;
         background: var(--chip); padding: 2px 6px; border-radius: 4px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin: 4px 0 0; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .85rem; }
td.num { white-space: nowrap; }
.passed, .matched, .complete { color: var(--ok); }
.pending, .not_comparable, .partial, .not_applicable, .not_found { color: var(--warn); }
.failed, .mismatch { color: var(--bad); }
footer { color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line);
         padding-top: 12px; margin-top: 40px; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
<footer>
  <p>{{ disclaimer }} Every value on this page comes from the SEC filings it links to; a value
  that failed a check is shown as missing, with why, never estimated.</p>
</footer>
</main>
</body>
</html>
